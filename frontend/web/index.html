<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Prevent mobile browsers from zooming when focusing inputs -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    /* Ensure Flutter's root elements can resize properly when the virtual keyboard opens */
    html, body, #flutter-root, flt-glass-pane, flt-platform-view {
      height: 100%;
      min-height: 100%;
    }
    body {
      -webkit-overflow-scrolling: touch;
      margin: 0;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mbaymi">
  <link rel="apple-touch-icon" href="assets/assets/images/a.jpg">

  <!-- Favicon (using project asset a.jpg) -->
  <link rel="icon" type="image/jpeg" href="assets/assets/images/a.jpg"/>

  <title>mbaymi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Shim: when visualViewport shrinks (keyboard opens), try to bring the active element into view
    (function() {
      const vv = window.visualViewport;
      if (!vv) return;
      vv.addEventListener('resize', () => {
        const active = document.activeElement;
        // Post a message so Flutter web can react (visual viewport changed)
        try {
          window.postMessage({ type: 'visualViewport', height: vv.height, offsetTop: vv.offsetTop }, '*');
        } catch (e) {}
        if (!active) return;
        // small delay so layout has settled
        setTimeout(() => {
          try {
            active.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } catch (e) {}
          // fallback: compute rect and adjust page scroll if needed
          try {
            const r = active.getBoundingClientRect();
            const viewHeight = vv.height || window.innerHeight;
            if (r.top < 0 || r.bottom > viewHeight) {
              const delta = r.top - (viewHeight / 2) + (r.height / 2);
              window.scrollTo({ top: window.pageYOffset + delta, behavior: 'smooth' });
            }
          } catch (e) {}
        }, 60);
      });
    })();
  </script>
</body>
</html>
