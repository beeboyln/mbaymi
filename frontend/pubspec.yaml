name: mbaymi
description: Agricultural management application for farmers and livestock breeders.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.0
  image_picker: ^0.8.7+4
  image: ^4.0.0
  flutter_dotenv: ^5.0.2
  intl: 0.20.2
  shared_preferences: ^2.1.1
  url_launcher: ^6.2.0
  cached_network_image: ^3.3.0
  video_player: ^2.10.1
  flutter_map: ^6.1.0
  geolocator: ^9.0.2
  latlong2: ^0.9.1
  flutter_quill: ^11.5.0
  pdf: ^3.10.0
  printing: ^5.11.0
  uuid: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter_launcher_icons:
  image_path: "assets/images/aa.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env
  
  # Fonts will be added when font files are added
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
