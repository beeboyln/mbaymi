[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbaymi-backend"
version = "0.1.0"
description = "Mbaymi backend API built with FastAPI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=21.3.0",
  "python-multipart>=0.0.6",
  "email-validator>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "starlette>=0.27.0",
  "anyio>=3.7.0",
  "requests>=2.31.0",
  "PyJWT>=2.8.0",
  "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.0.0",
  "flake8>=6.1.0",
]
